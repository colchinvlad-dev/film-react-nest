services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - film-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - film-network
    depends_on:
      - database

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/colchinvlad-dev/film-react-nest/backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}
    networks:
      - film-network
    depends_on:
      database:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ghcr.io/colchinvlad-dev/film-react-nest/server:latest
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - film-network
    depends_on:
      - backend

volumes:
  pg-data:
  pgadmin-data:

networks:
  film-network:
    driver: bridge